[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 800
remappings = ["@openzeppelin/=node_modules/@openzeppelin/"]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false

[lint]
# Windows here are hours/days long; second-level validator drift is irrelevant.
exclude_lints = ["block-timestamp"]
