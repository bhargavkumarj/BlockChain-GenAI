name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts · fmt + unit/fuzz/invariant tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @pactum/contracts
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Check formatting
        working-directory: contracts
        run: forge fmt --check
      - name: Test
        working-directory: contracts
        run: forge test -vv

  web:
    name: Web · lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @pactum/web test
      - run: pnpm build

  e2e:
    name: End-to-end · full lifecycle on a local chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Start anvil, deploy Pactum, write web/.env.local
        run: |
          anvil --silent &
          for i in $(seq 1 30); do
            curl -sf -X POST -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8545 && break
            sleep 1
          done
          pnpm devnet
      - name: Build the app
        run: pnpm build
      - name: Start a mock Messages API and the app in live-AI mode
        run: |
          node web/e2e/mock-anthropic.mjs > mock.log 2>&1 &
          cd web
          ANTHROPIC_BASE_URL=http://127.0.0.1:4010 ANTHROPIC_API_KEY=sk-mock npx next start -p 3000 > ../app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/status && break; sleep 1; done
      - name: Install Chromium
        run: pnpm --filter @pactum/web exec playwright install --with-deps chromium
      - name: Draft → seal → deliver → dispute → tribunal → ruling → release
        run: BASE_URL=http://localhost:3000 SHOTS=e2e-shots pnpm e2e
      - name: Every model request honoured the API contract
        run: |
          cat mock.log
          test "$(curl -s http://127.0.0.1:4010/__problems)" = "[]"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: |
            web/e2e-shots
            app.log
            mock.log
